<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="title description">
  <title id="title">skyBL0106</title>
  <desc id="description">Bubbles bounce around the profile name as a soft light moves across the background.</desc>
  <defs>
    <clipPath id="bannerClip">
      <rect width="960" height="240" rx="24" />
    </clipPath>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#351018" />
      <stop offset="0.58" stop-color="#a52435" />
      <stop offset="1" stop-color="#421e27" />
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <pattern id="texture" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.12" />
    </pattern>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#197278" />
      <stop offset="1" stop-color="#d98b2b" />
    </linearGradient>
    <radialGradient id="bubble" cx="32%" cy="26%" r="74%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.28" stop-color="#63c5c1" stop-opacity="0.9" />
      <stop offset="1" stop-color="#197278" stop-opacity="0.7" />
    </radialGradient>
    <radialGradient id="amber" cx="32%" cy="26%" r="74%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.3" stop-color="#ffd17e" stop-opacity="0.95" />
      <stop offset="1" stop-color="#d98b2b" stop-opacity="0.8" />
    </radialGradient>
  </defs>

  <rect width="960" height="240" rx="24" fill="url(#background)" />
  <rect width="960" height="240" rx="24" fill="url(#texture)" />
  <g clip-path="url(#bannerClip)">
    <rect x="-300" y="0" width="300" height="240" fill="url(#sweep)">
      <animate attributeName="x" values="-300;960" dur="9s" repeatCount="indefinite" />
    </rect>
  </g>
  <rect x="1" y="1" width="958" height="238" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.16" />

  <g opacity="0.95">
    <circle cx="118" cy="151" r="20" fill="url(#bubble)">
      <animate attributeName="cy" values="151;112;151" dur="1.5s" begin="0s" repeatCount="indefinite" />
    </circle>
    <circle cx="238" cy="169" r="13" fill="url(#amber)">
      <animate attributeName="cy" values="169;137;169" dur="1.25s" begin="0.32s" repeatCount="indefinite" />
    </circle>
    <circle cx="353" cy="188" r="9" fill="url(#bubble)">
      <animate attributeName="cy" values="188;163;188" dur="1.1s" begin="0.14s" repeatCount="indefinite" />
    </circle>
    <circle cx="610" cy="184" r="11" fill="url(#amber)">
      <animate attributeName="cy" values="184;155;184" dur="1.3s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="738" cy="164" r="16" fill="url(#bubble)">
      <animate attributeName="cy" values="164;128;164" dur="1.45s" begin="0.22s" repeatCount="indefinite" />
    </circle>
    <circle cx="850" cy="146" r="22" fill="url(#amber)">
      <animate attributeName="cy" values="146;102;146" dur="1.6s" begin="0.68s" repeatCount="indefinite" />
    </circle>
  </g>

  <text x="480" y="119" text-anchor="middle" font-family="Verdana, sans-serif" font-size="66" font-weight="700" fill="url(#name)" stroke="#ffffff" stroke-opacity="0.82" stroke-width="3" paint-order="stroke">skyBL0106</text>
  <text x="480" y="158" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" font-weight="600" letter-spacing="2" fill="#e1f1ee">PROJECTS  |  EXPERIMENTS  |  LEARNING</text>
</svg>
